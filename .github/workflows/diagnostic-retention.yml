name: Diagnostic retention regressions

on:
  push:
    branches: [fix/0.16.4-diagnostic-retention]

permissions:
  contents: read

jobs:
  source:
    name: Exact source snapshot
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostic-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/diagnostic-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/diagnostic-source/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/diagnostic-source/tree.txt"
          xcodebuild -version
          swift --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-source-${{ github.sha }}
          path: ${{ runner.temp }}/diagnostic-source/*
          retention-days: 7
